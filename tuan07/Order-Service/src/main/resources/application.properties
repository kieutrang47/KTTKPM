spring.application.name=Order-Service
server.port=8083
server.address=0.0.0.0

spring.datasource.url=jdbc:h2:file:~/order_sba_db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- GIAO TIẾP MICROSERVICES (LAN DEPLOYMENT) ---
# Nếu chạy ở máy khác trong mạng LAN, đổi localhost thành IP máy đó (VD: http://192.168.1.5:8082)
food.service.url=${FOOD_SERVICE_URL:http://192.168.137.129:8082}
user.service.url=${USER_SERVICE_URL:http://192.168.137.238:8081}
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8084}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# Redis - trỏ về máy bạn (192.168.137.238)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:192.168.137.238}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}