<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Order - 8082</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 35px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.6em;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #34495e;
            font-size: 0.9em;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }
        button {
            width: 100%;
            background-color: #2ecc71;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #27ae60;
        }
        .alert {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            margin-top: 20px;
            text-align: center;
            font-size: 0.95em;
            border: 1px solid #c3e6cb;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>Hệ Thống Đặt Đồ Ăn</h2>
    <form th:action="@{/checkout}" method="post">
        <div class="form-group">
            <label>Tên khách hàng:</label>
            <input name="customerName" placeholder="Nhập tên của bạn" required/>
        </div>

        <div class="form-group">
            <label>Chọn món ăn:</label>
            <select name="item">
                <option th:each="m : ${menu}"
                        th:value="${m['name']}"
                        th:text="${m['name'] + ' - ' + m['price'] + ' VNĐ'}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>Xác nhận giá tiền:</label>
            <input name="price" type="number" placeholder="Nhập lại giá tiền" required/>
        </div>

        <button type="submit">Đặt Hàng Ngay</button>
    </form>

    <div class="alert" th:if="${param.success}">
        ✅ Đã đặt đơn thành công! <br> Shipper đang chuẩn bị giao hàng.
    </div>
</div>
</body>
</html>
