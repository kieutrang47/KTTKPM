spring.application.name=Payment-Service
server.port=8084

spring.datasource.url=jdbc:h2:file:~/payment_sba_db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- GIAO TIẾP MICROSERVICES (LAN DEPLOYMENT) ---
# Nếu chạy ở máy khác trong mạng LAN, đổi localhost thành IP của máy chạy Order Service 
order.service.url=http://localhost:8083
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

