version: "3.8"

# MÁY B (Đảm nhận Thực đơn và Đơn Hàng)
services:
  catalog-service:
    build: ../Catalog-Service
    container_name: catalog-service
    ports:
      - "8082:8082"

  order-service:
    build: ../Order-Service
    container_name: order-service
    ports:
      - "8083:8083"
    environment:
      # Trỏ về Máy A để dùng chung Redis và User
      - SPRING_DATA_REDIS_HOST=${IP_MAY_A}
      - USER_SERVICE_URL=http://${IP_MAY_A}:8081
      # Gọi nội bộ máy B
      - FOOD_SERVICE_URL=http://catalog-service:8082
      # Trỏ tới Máy C
      - PAYMENT_SERVICE_URL=http://${IP_MAY_C}:8084
    depends_on:
      - catalog-service
